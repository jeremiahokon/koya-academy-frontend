<!doctype html>
<!-- Source for app/opengraph-image.jpg and app/twitter-image.jpg. Re-render with:
     scripts/render-og.sh  (headless Chrome, 1200x630, same Instrument Sans the site uses) -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&display=block"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
      }
      body {
        background: #f5f1ea;
        color: #1b2422;
        font-family: 'Instrument Sans', sans-serif;
        display: grid;
        grid-template-columns: 1fr 380px;
        align-items: center;
        padding: 0 80px;
        box-sizing: border-box;
        gap: 60px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 34px;
        font-weight: 600;
        margin-bottom: 40px;
      }
      .mark {
        width: 56px;
        height: 56px;
      }
      h1 {
        font-size: 66px;
        line-height: 1.05;
        margin: 0 0 24px;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      p {
        font-size: 28px;
        color: #5a6662;
        margin: 0;
      }
      .slots {
        background: #fffdf9;
        border: 2px solid #ddd5c8;
        border-radius: 16px;
        overflow: hidden;
      }
      .slot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 24px;
        font-size: 24px;
        border-top: 2px solid #ddd5c8;
      }
      .slot:first-child {
        border-top: 0;
      }
      .t {
        font-weight: 600;
      }
      .b {
        background: #0e4f45;
        color: #fff;
        padding: 6px 16px;
        border-radius: 8px;
        font-weight: 600;
      }
      .x {
        color: #5a6662;
        text-decoration: line-through;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="brand">
        <svg class="mark" viewBox="0 0 64 64">
          <rect width="64" height="64" rx="14" fill="#0e4f45" />
          <path d="M27 14h10v13h13v10H37v13H27V37H14V27h13z" fill="#fff" /></svg
        >Koya Clinic
      </div>
      <h1>Book a clinic appointment in under a minute</h1>
      <p>Open slots by doctor. No account needed.</p>
    </div>
    <div class="slots">
      <div class="slot">
        <span class="t">09:00 Dr Ade</span><span class="b">Book</span>
      </div>
      <div class="slot x"><span>09:30 Dr Ade</span><span>Booked</span></div>
      <div class="slot">
        <span class="t">10:00 Dr Bello</span><span class="b">Book</span>
      </div>
      <div class="slot">
        <span class="t">10:30 Dr Chukwu</span><span class="b">Book</span>
      </div>
    </div>
  </body>
</html>
